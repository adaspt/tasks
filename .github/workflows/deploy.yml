name: Deploy

on:
  push:
    branches: [main]
  # So a deploy can be re-run without an empty commit.
  workflow_dispatch:

# A newer push to main makes an in-flight deploy pointless.
concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for the service account's Workload Identity, if used.
      id-token: write

    steps:
      # v5 of both runs on Node 24. v4 targets Node 20, which GitHub now forces
      # onto 24 anyway and warns about.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Gates the deploy. A broken build should not reach the phone that this
      # app is the only copy of some tasks on.
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # The function is a separate npm project with its own lockfile. Its build
      # also runs in firebase.json's predeploy, but doing it here means a
      # type error fails the job before anything is shipped.
      - run: npm ci --prefix functions
      - run: npm run build --prefix functions

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Replaces action-hosting-deploy, which only ever handled hosting. Both
      # targets go in one command so the /api rewrite and the function it points
      # at can never be deployed apart.
      - run: npx --yes firebase-tools@latest deploy --only hosting,functions --project tasks-505418 --non-interactive
