name: Deploy

on:
  push:
    branches: [main]
  # So a deploy can be re-run without an empty commit.
  workflow_dispatch:

# A newer push to main makes an in-flight deploy pointless.
concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for the service account's Workload Identity, if used.
      id-token: write

    steps:
      # v5 of both runs on Node 24. v4 targets Node 20, which GitHub now forces
      # onto 24 anyway and warns about.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Gates the deploy. A broken build should not reach the phone that this
      # app is the only copy of some tasks on.
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: tasks-505418
          channelId: live
